<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#edf3f0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7c66"/>
      <stop offset="100%" stop-color="#11a585"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.10" flood-color="#14201a"/>
    </filter>
  </defs>

  <rect width="900" height="720" fill="url(#bg)"/>
  <rect x="24" y="18" width="852" height="684" rx="18" fill="#ffffff" filter="url(#shadow)"/>

  <!-- header -->
  <rect x="24" y="18" width="852" height="86" rx="18" fill="url(#head)"/>
  <text x="72" y="56" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="0">发票整理员 · 执行成功</text>
  <circle cx="760" cy="52" r="22" fill="#ffffff" opacity="0.18"/>
  <path d="M750 49 l10 14 22-30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- input -->
  <rect x="52" y="134" width="236" height="112" rx="14" fill="#ffffff" stroke="#d5e4dc" stroke-width="1.5"/>
  <rect x="52" y="134" width="236" height="38" rx="14" fill="#eef7f3"/>
  <text x="70" y="159" fill="#0e7c66" font-size="15" font-weight="700">输入</text>
  <text x="70" y="194" fill="#24313a" font-size="16" font-weight="650">原始发票 Excel</text>
  <text x="70" y="218" fill="#6a747d" font-size="13">.xlsx · 一行一张发票</text>

  <!-- steps -->
  <rect x="308" y="80" width="250" height="56" rx="14" fill="#ffffff" stroke="#d5e4dc" stroke-width="1.5"/>
  <text x="326" y="107" fill="#0e7c66" font-size="14" font-weight="700">流程</text>
  <text x="326" y="126" fill="#6a747d" font-size="13">读取 → 清洗 → 分类 → 汇总</text>

  <!-- validation badge -->
  <rect x="578" y="80" width="282" height="56" rx="14" fill="#0e7c66"/>
  <text x="602" y="116" fill="#ffffff" font-size="22" font-weight="700">校验通过</text>
  <text x="776" y="114" fill="#ffeccb" font-size="12">误差 &lt; 0.01</text>

  <!-- three sheets -->
  <text x="52" y="292" fill="#18202a" font-size="18" font-weight="700">输出：3 个工作表</text>

  <g filter="url(#shadow)">
    <rect x="52" y="312" width="250" height="250" rx="16" fill="#ffffff" stroke="#e2e8e3" stroke-width="1.5"/>
    <rect x="52" y="312" width="250" height="52" rx="16" fill="#eef7f3"/>
    <text x="70" y="346" fill="#0e7c66" font-size="16" font-weight="700">Sheet 1 · 清洗后明细</text>
    <g font-size="12" fill="#4d5c6b">
      <text x="72" y="386">日期</text>
      <text x="164" y="386">供应商</text>
      <text x="228" y="386">金额</text>
      <line x1="72" y1="398" x2="282" y2="398" stroke="#e3e9e5"/>
      <text x="72" y="420" fill="#0e7c66">2026-08-01</text>
      <text x="164" y="420">携程</text>
      <text x="228" y="420" font-weight="600">128.00</text>
      <line x1="72" y1="432" x2="282" y2="432" stroke="#eef1f0"/>
      <text x="72" y="454" fill="#0e7c66">2026-08-02</text>
      <text x="164" y="454">京东</text>
      <text x="228" y="454" font-weight="600">340.00</text>
      <line x1="72" y1="466" x2="282" y2="466" stroke="#eef1f0"/>
      <text x="72" y="488" fill="#0e7c66">2026-08-03</text>
      <text x="164" y="488">电信</text>
      <text x="228" y="488" font-weight="600">89.50</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="322" y="312" width="250" height="250" rx="16" fill="#ffffff" stroke="#e8e8e1" stroke-width="1.5"/>
    <rect x="322" y="312" width="250" height="52" rx="16" fill="#fef6ea"/>
    <text x="340" y="346" fill="#b75d13" font-size="16" font-weight="700">Sheet 2 · 类别汇总</text>
    <g font-size="12" fill="#49555f">
      <text x="342" y="386">报销类别</text>
      <text x="446" y="386">金额合计</text>
      <text x="526" y="386">张数</text>
      <line x1="342" y1="398" x2="552" y2="398" stroke="#efe5d5"/>
      <text x="342" y="420">交通费</text>
      <text x="446" y="420" font-weight="600">1,428.00</text>
      <text x="526" y="420">12</text>
      <line x1="342" y1="432" x2="552" y2="432" stroke="#f3eadc"/>
      <text x="342" y="454">办公费</text>
      <text x="446" y="454" font-weight="600">966.50</text>
      <text x="526" y="454">8</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="592" y="312" width="244" height="250" rx="16" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.5"/>
    <rect x="592" y="312" width="244" height="52" rx="16" fill="#edf3fa"/>
    <text x="612" y="346" fill="#1d4f91" font-size="16" font-weight="700">Sheet 3 · 按月统计</text>
    <g font-size="12" fill="#49555f">
      <text x="612" y="386">月份</text>
      <text x="694" y="386">金额</text>
      <text x="772" y="386">张数</text>
      <line x1="612" y1="398" x2="820" y2="398" stroke="#dbe6ef"/>
      <text x="612" y="420">2026-08</text>
      <text x="694" y="420" font-weight="600">3,284.00</text>
      <text x="772" y="420">28</text>
      <line x1="612" y1="432" x2="820" y2="432" stroke="#ecf1f5"/>
      <text x="612" y="454">2026-07</text>
      <text x="694" y="454" font-weight="600">2,107.25</text>
      <text x="772" y="454">19</text>
    </g>
  </g>

  <!-- result line -->
  <rect x="52" y="592" width="760" height="68" rx="16" fill="#f4faf7" stroke="#bfe5d5" stroke-width="1.5"/>
  <text x="74" y="626" fill="#0e7c66" font-size="15" font-weight="700">完成 · 下载链接已生成</text>
  <text x="74" y="648" fill="#5a6a6b" font-size="13">三张工作表可打开，金额合计与原始数据一致，未修改原始上传文件。</text>

  <rect x="724" y="608" width="78" height="36" rx="18" fill="#0e7c66"/>
  <text x="746" y="632" fill="#ffffff" font-size="14" font-weight="600">下载</text>
</svg>
